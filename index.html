    async function compressImage(file, maxWidth = 1200, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
                type: 'image/jpeg',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            }, 'image/jpeg', quality);
          };
        };
      });
    }

    // ROBUST POSTCODE / OUTCODE & MOCK COORDINATE RESOLVER
    async function fetchPostcodeCoords(postcode) {
      if (!postcode) return { lat: 52.4068, lng: -1.5197 };
      const cleaned = postcode.trim();

      // 1. Try full postcode lookup
      try {
        const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(cleaned)}`);
        const data = await res.json();
        if (data.status === 200 && data.result) {
          return { lat: data.result.latitude, lng: data.result.longitude };
        }
      } catch (e) {}

      // 2. Try outward code lookup (e.g. "CV1")
      try {
        const res2 = await fetch(`https://api.postcodes.io/outcodes/${encodeURIComponent(cleaned)}`);
        const data2 = await res2.json();
        if (data2.status === 200 && data2.result) {
          return { lat: data2.result.latitude, lng: data2.result.longitude };
        }
      } catch (e) {}

      // 3. Fallback for mock/test postcodes (e.g. "test3", "test4")
      let hash = 0;
      for (let i = 0; i < cleaned.length; i++) {
        hash = cleaned.charCodeAt(i) + ((hash << 5) - hash);
      }
      const latOffset = (Math.abs(hash) % 20 - 10) * 0.03;
      const lngOffset = (Math.abs(hash >> 3) % 20 - 10) * 0.03;
      return { lat: 52.4068 + latOffset, lng: -1.5197 + lngOffset };
    }

    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    async function handlePostcodeChange() {
      const postcode = document.getElementById('postcodeInput').value.trim();
      if (!postcode) return;
      const coords = await fetchPostcodeCoords(postcode);
      if (coords) {
        userCoords = coords;
      }
      for (let car of allCars) {
        if (car.postcode) {
          const carCoords = await fetchPostcodeCoords(car.postcode);
          if (carCoords) {
            car.computed_distance = calculateDistanceMiles(userCoords.lat, userCoords.lng, carCoords.lat, carCoords.lng);
          } else {
            car.computed_distance = 5;
          }
        } else {
          car.computed_distance = 5;
        }
      }
      applyFilters();
    }

        } else {
          const compressed = await compressImage(item);
          const fileName = `${Math.random()}.jpg`;
          const filePath = `car-photos/${fileName}`;

          const { error: uploadError } = await supabaseClient.storage.from('car-photos').upload(filePath, compressed);
          if (!uploadError) {
            const { data } = supabaseClient.storage.from('car-photos').getPublicUrl(filePath);
            if (data && data.publicUrl) finalImageUrls.push(data.publicUrl);
          }
        }
      }

      if (finalImageUrls.length === 0) {
        finalImageUrls.push("https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80");
      }

      submitBtn.innerText = editingCarId ? "Updating Listing..." : "Publishing...";

      const postcode = document.getElementById('newPostcode').value.toUpperCase();
      const coords = await fetchPostcodeCoords(postcode);

      const carData = {
        title: document.getElementById('newTitle').value,
        price: parseInt(document.getElementById('newPrice').value),
        fuel: document.getElementById('newFuel').value,
        mileage: document.getElementById('newMileage').value,
        postcode: postcode,
        distance_miles: coords ? calculateDistanceMiles(userCoords.lat, userCoords.lng, coords.lat, coords.lng) : 5,
        garage: "My Workshop Garage",
        fixes: document.getElementById('newNotes').value,
        image: finalImageUrls.join(','),
        user_id: currentUser.id
      };

      let error;
      if (editingCarId) {
        const res = await supabaseClient.from('cars').update(carData).eq('id', editingCarId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('cars').insert([carData]);
        error = res.error;
      }

      submitBtn.innerText = "Publish Listing";
      submitBtn.disabled = false;

      if (error) {
        showToast('DB Error: ' + error.message);
        return;
      }

      closeModal('postModal');
      editingCarId = null;
      selectedFilesArray = [];
      renderPhotoPreviews();
      document.getElementById('newImageFiles').value = '';
      await fetchCars();
      showToast(editingCarId ? 'Listing updated successfully!' : 'Vehicle posted successfully!');
    }

    function openEditModal(id) {
      const car = allCars.find(c => c.id === id);
      if (!car) return;

      editingCarId = car.id;
      document.getElementById('postModalTitle').innerText = "Edit Vehicle Listing";
      document.getElementById('postModalSub').innerText = "Update details or modify uploaded photos";
      document.getElementById('submitBtn').innerText = "Save Changes";

      document.getElementById('newTitle').value = car.title || '';
      document.getElementById('newPrice').value = car.price || '';
      document.getElementById('newFuel').value = car.fuel || 'Hybrid';
      document.getElementById('newMileage').value = car.mileage || '';
      document.getElementById('newPostcode').value = car.postcode || '';
      document.getElementById('newNotes').value = car.fixes || '';

      selectedFilesArray = car.image ? car.image.split(',') : [];
      renderPhotoPreviews();

      closeModal('detailModal');
      document.getElementById('postModal').classList.remove('hidden');
    }

    async function deleteCar(id, fromModal = false) {
      if (!confirm('Are you sure you want to permanently delete this listing?')) return;

      const { error } = await supabaseClient.from('cars').delete().eq('id', id);

      if (error) {
        showToast('Failed to delete listing');
        return;
      }

      allCars = allCars.filter(c => c.id !== id);
      applyFilters();

      if (fromModal) closeModal('detailModal');
      showToast('Listing deleted');
    }

    function renderCars(carsToRender) {
      const grid = document.getElementById('carGrid');
      grid.innerHTML = '';

      if (carsToRender.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-xl text-center border border-dashed border-gray-300">
            <i class="fas fa-car-side text-4xl text-gray-300 mb-2"></i>
            <h4 class="font-bold text-gray-700">No vehicles found</h4>
            <p class="text-xs text-gray-500 mt-1">Try expanding your distance radius or clearing your filters.</p>
          </div>
        `;
        return;
      }

      carsToRender.forEach(car => {
        const canManage = currentUser && (car.user_id === currentUser.id || !car.user_id);
        const imagesList = car.image ? car.image.split(',') : ['https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=600&q=80'];

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition flex flex-col";
        card.innerHTML = `
          <div class="relative h-48 overflow-hidden bg-gray-100 group">
            <img id="card-img-${car.id}" src="${imagesList[0]}" alt="${car.title}" data-index="0" data-images='${JSON.stringify(imagesList)}' class="w-full h-full object-cover transition-all duration-300">
            
            <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[11px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-sm z-10">
              <i class="fas fa-gas-pump text-green-400 mr-1"></i>${car.fuel}
            </span>
            <span class="absolute top-2 right-2 bg-green-600 text-white text-xs font-bold px-2 py-1 rounded-md shadow z-10">
              £${Number(car.price).toLocaleString()}
            </span>

            ${imagesList.length > 1 ? `
              <button onclick="event.stopPropagation(); slideCardImage(${car.id}, -1)" class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs opacity-80 group-hover:opacity-100 transition z-10">
                <i class="fas fa-chevron-left"></i>
              </button>
              <button onclick="event.stopPropagation(); slideCardImage(${car.id}, 1)" class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs opacity-80 group-hover:opacity-100 transition z-10">
                <i class="fas fa-chevron-right"></i>
              </button>
              <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full z-10">
                📸 <span id="img-counter-${car.id}">1/${imagesList.length}</span>
              </span>
            ` : ''}
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 text-base leading-snug mb-1">${car.title}</h3>
              <div class="flex items-center space-x-3 text-xs text-gray-500 mb-3">
                <span><i class="fas fa-tachometer-alt mr-1 text-gray-400"></i>${car.mileage}</span>
                <span>•</span>
                <span><i class="fas fa-map-marker-alt mr-1 text-green-600"></i>${car.computed_distance !== undefined ? car.computed_distance : 5} miles away (${car.postcode})</span>
              </div>

              <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-3 text-xs text-gray-700">
                <div class="font-semibold text-slate-900 mb-0.5 flex items-center">
                  <i class="fas fa-wrench text-xs text-green-600 mr-1.5"></i> Garage Fixes Executed:
                </div>
                <p class="line-clamp-2 text-gray-600 text-[11px]">${car.fixes}</p>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between text-xs border-t pt-2.5 text-gray-500">
                <span class="font-medium text-gray-800"><i class="fas fa-store mr-1 text-slate-400"></i>${car.garage || 'Verified Garage'}</span>
                <span class="text-amber-600 font-bold">5.0 ★</span>
              </div>
              
              <div class="mt-3 flex gap-2">
                <button onclick="openDetailModal(${car.id})" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition">
                  View Inspection & Gallery
                </button>
                ${canManage ? `
                  <button onclick="openEditModal(${car.id})" class="px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-lg transition" title="Edit Listing">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button onclick="deleteCar(${car.id})" class="px-3 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition" title="Delete Listing">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function slideCardImage(carId, direction) {
      const imgElement = document.getElementById(`card-img-${carId}`);
      const counterElement = document.getElementById(`img-counter-${carId}`);
      if (!imgElement) return;

      const images = JSON.parse(imgElement.dataset.images || '[]');
      let currentIndex = parseInt(imgElement.dataset.index || '0');

      currentIndex += direction;
      if (currentIndex < 0) currentIndex = images.length - 1;
      if (currentIndex >= images.length) currentIndex = 0;

      imgElement.dataset.index = currentIndex;
      imgElement.src = images[currentIndex];
      if (counterElement) {
        counterElement.innerText = `${currentIndex + 1}/${images.length}`;
      }
    }

    function applyFilters() {
      const radiusVal = document.getElementById('radiusSelect').value;
      const fuel = document.getElementById('fuelSelect').value;
      const keyword = document.getElementById('keywordInput').value.toLowerCase();
      const userPostcode = document.getElementById('postcodeInput').value.toUpperCase() || "CV1 2WT";

      const filtered = allCars.filter(car => {
        const dist = car.computed_distance !== undefined ? car.computed_distance : 5;
        const matchesRadius = (radiusVal === 'ALL') || (dist <= parseInt(radiusVal));
        const matchesFuel = (fuel === 'ALL') || (car.fuel === fuel);
        const matchesKeyword = (car.title && car.title.toLowerCase().includes(keyword)) || (car.fixes && car.fixes.toLowerCase().includes(keyword));
        return matchesRadius && matchesFuel && matchesKeyword;
      });

      const radiusText = radiusVal === 'ALL' ? 'Nationwide (Whole Country)' : `within ${radiusVal} miles of ${userPostcode}`;
      document.getElementById('resultsCount').innerText = `Showing ${filtered.length} garage-inspected cars ${radiusText}`;
      renderCars(filtered);
    }

    function resetFilters() {
      document.getElementById('radiusSelect').value = "ALL";
      document.getElementById('fuelSelect').value = "ALL";
      document.getElementById('keywordInput').value = "";
      document.getElementById('postcodeInput').value = "CV1 2WT";
      userCoords = { lat: 52.4068, lng: -1.5197 };
      applyFilters();
    }

    function openDetailModal(id) {
      const car = allCars.find(c => c.id === id);
      if (!car) return;

      const canManage = currentUser && (car.user_id === currentUser.id || !car.user_id);
      const imagesList = car.image ? car.image.split(',') : ['https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=600&q=80'];

      document.getElementById('modalTitle').innerText = car.title;
      document.getElementById('modalBody').innerHTML = `
        <div class="relative h-64 bg-gray-900 rounded-xl overflow-hidden shadow-inner">
          <img id="mainHeroImage" src="${imagesList[0]}" class="w-full h-full object-cover">
        </div>

        ${imagesList.length > 1 ? `
          <div class="flex gap-2 overflow-x-auto py-1">
            ${imagesList.map((url, idx) => `
              <img src="${url}" onclick="setGalleryHero('${url}', this)" class="w-20 h-16 object-cover rounded-lg cursor-pointer border-2 ${idx === 0 ? 'border-green-600' : 'border-transparent opacity-70 hover:opacity-100'} transition thumb-img">
            `).join('')}
          </div>
        ` : ''}

        <div class="flex justify-between items-center bg-green-50 p-3 rounded-lg border border-green-200">
          <div>
            <span class="text-xs text-green-800 uppercase font-bold tracking-wide">Direct Garage Price</span>
            <div class="text-2xl font-bold text-green-700">£${Number(car.price).toLocaleString()}</div>
          </div>
          <span class="text-xs bg-green-200 text-green-900 font-semibold px-2.5 py-1 rounded-full">3 Months Garage Warranty</span>
        </div>

        <div class="space-y-2 text-sm text-gray-700">
          <h4 class="font-bold text-gray-900 flex items-center"><i class="fas fa-clipboard-check text-green-600 mr-2"></i> Mechanic Inspection Report</h4>
          <p class="bg-gray-50 p-3 rounded-lg border text-xs text-gray-600 leading-relaxed">${car.fixes}</p>
        </div>

        <div class="border-t pt-3 flex items-center justify-between">
          <div>
            <div class="font-bold text-gray-900">${car.garage || 'Verified Garage'}</div>
            <div class="text-xs text-gray-500"><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i>${car.postcode} (${car.computed_distance !== undefined ? car.computed_distance : 5} miles away)</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="showToast('Connecting to Garage Phone: 024 7600 1122')" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold text-xs rounded-lg shadow">
              <i class="fas fa-phone-alt mr-1"></i> Call Garage
            </button>
            ${canManage ? `
              <button onclick="openEditModal(${car.id})" class="px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow" title="Edit Listing">
                <i class="fas fa-edit mr-1"></i> Edit
              </button>
              <button onclick="deleteCar(${car.id}, true)" class="px-3 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg shadow" title="Delete Listing">
                <i class="fas fa-trash-alt mr-1"></i> Delete
              </button>
            ` : ''}
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }
    
    function setGalleryHero(url, thumbElement) {
      document.getElementById('mainHeroImage').src = url;
      document.querySelectorAll('.thumb-img').forEach(el => {
        el.classList.remove('border-green-600');
        el.classList.add('border-transparent', 'opacity-70');
      });
      thumbElement.classList.remove('border-transparent', 'opacity-70');
      thumbElement.classList.add('border-green-600');
    }

    function openPostModal() {
      if (!currentUser) {
        showToast('Please log in or create a garage account.');
        openAuthModal();
        return;
      }
      editingCarId = null;
      document.getElementById('postModalTitle').innerText = "Post Fixed Car for Sale";
      document.getElementById('postModalSub').innerText = "List an inspected vehicle repaired in your workshop";
      document.getElementById('submitBtn').innerText = "Publish Listing";
      
      document.getElementById('newTitle').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newMileage').value = '';
      document.getElementById('newPostcode').value = '';
      document.getElementById('newNotes').value = '';
      
      selectedFilesArray = [];
      renderPhotoPreviews();
      document.getElementById('postModal').classList.remove('hidden');
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function toggleMobileView() {
      const container = document.getElementById('appContainer');
      const icon = document.getElementById('viewIcon');
      const text = document.getElementById('viewText');

      isMobileView = !isMobileView;
      if (isMobileView) {
        container.className = "mobile-wrapper my-6";
        container.children[0].classList.add('text-xs');
        icon.className = "fas fa-desktop text-green-400";
        text.innerText = "Switch to Desktop View";
      } else {
        container.className = "max-w-7xl mx-auto p-4 md:p-6 transition-all duration-300";
        icon.className = "fas fa-mobile-alt text-green-400";
        text.innerText = "Switch to Mobile Frame View";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAuth();
      fetchCars();
    });
  </script>

</body>
</html>
