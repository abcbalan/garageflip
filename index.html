          <h3 class="font-bold text-lg">Post Fixed Car for Sale</h3>
          <p class="text-xs text-gray-400">List an inspected vehicle repaired in your garage</p>

      </div>
      <form onsubmit="handleNewPost(event)" class="p-6 overflow-y-auto space-y-4 text-sm">

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Make & Model</label>
            <input required type="text" id="newTitle" placeholder="e.g. 2021 Honda ZR-V e:HEV" class="w-full p-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Price (£)</label>
            <input required type="number" id="newPrice" placeholder="24500" class="w-full p-2 border rounded-lg">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Fuel Type</label>
            <select id="newFuel" class="w-full p-2 border rounded-lg">
              <option value="Hybrid">Hybrid</option>
              <option value="Petrol">Petrol</option>
              <option value="Diesel">Diesel</option>
              <option value="Electric">Electric</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Mileage</label>
            <input required type="text" id="newMileage" placeholder="18,500 miles" class="w-full p-2 border rounded-lg">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Garage Postcode</label>
            <input required type="text" id="newPostcode" placeholder="CV1 2WT" class="w-full p-2 border rounded-lg">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Garage Repair & Service Notes</label>
          <textarea required id="newNotes" rows="3" placeholder="Describe the fixes executed in your shop..." class="w-full p-2 border rounded-lg"></textarea>
        </div>

        <!-- IMAGE UPLOAD FIELD -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Upload Vehicle Photo</label>
          <input type="file" id="newImageFile" accept="image/*" class="w-full text-xs p-2 border rounded-lg bg-gray-50">
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-900">
          <label class="flex items-start space-x-2">
            <input required type="checkbox" class="mt-0.5 rounded text-green-600 focus:ring-green-500">
            <span><strong>Legal Ownership Declaration:</strong> I confirm this vehicle is fully owned by this garage.</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow">Publish Listing</button>
      </form>
    </div>
  </div>

  <script>
    // SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://idapulgrzglnadbpzhpv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkYXB1bGdyemdsbmFkYnB6aHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODQzNjIsImV4cCI6MjEwNzU2MDM2Mn0.WEOzuH2NU7ioqTdcYCa3scp-oqPsu2791aFfTFHa-3g';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allCars = [];
    let currentUser = null;
    let isMobileView = false;
    let isSignUpMode = false;
    let userCoords = { lat: 52.4068, lng: -1.5197 }; // Default Coventry coordinates

    // -------------------------------------------------------------
    // IMAGE COMPRESSION HELPER (Canvas)
    // -------------------------------------------------------------
    async function compressImage(file, maxWidth = 1200, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
                type: 'image/jpeg',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            }, 'image/jpeg', quality);
          };
        };
      });
    }

    // -------------------------------------------------------------
    // 1. DYNAMIC DISTANCE CALCULATION VIA POSTCODES.IO API
    // -------------------------------------------------------------
    async function fetchPostcodeCoords(postcode) {
      try {
        const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(postcode)}`);
        const data = await res.json();
        if (data.status === 200) {
          return { lat: data.result.latitude, lng: data.result.longitude };
        }
      } catch (e) {
        console.warn('Invalid postcode lookup:', postcode);
      }
      return null;
    }

    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Earth radius in miles
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    async function handlePostcodeChange() {
      const postcode = document.getElementById('postcodeInput').value.trim();
      if (!postcode) return;
      const coords = await fetchPostcodeCoords(postcode);
      if (coords) {
        userCoords = coords;
        applyFilters();
      }
    }

    // -------------------------------------------------------------
    // 2. SUPABASE AUTHENTICATION
    // -------------------------------------------------------------
    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session ? session.user : null;
      renderAuthNav();

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        currentUser = session ? session.user : null;
        renderAuthNav();
        renderCars(allCars);
      });
    }

    function renderAuthNav() {
      const container = document.getElementById('authNavButtons');
      if (currentUser) {
        container.innerHTML = `
          <button onclick="openPostModal()" class="bg-green-600 hover:bg-green-500 text-white font-medium text-xs md:text-sm px-3.5 py-1.5 rounded-lg flex items-center space-x-1.5 shadow transition">
            <i class="fas fa-plus-circle"></i>
            <span>Post Fixed Car</span>
          </button>
          <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg">
            Logout (${currentUser.email.split('@')[0]})
          </button>
        `;
      } else {
        container.innerHTML = `
          <button onclick="openAuthModal()" class="bg-green-600 hover:bg-green-500 text-white font-medium text-xs md:text-sm px-3.5 py-1.5 rounded-lg transition">
            Garage Login / Sign Up
          </button>
        `;
      }
    }

    function openAuthModal() {
      document.getElementById('authModal').classList.remove('hidden');
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authModalTitle').innerText = isSignUpMode ? "Garage Sign Up" : "Garage Login";
      document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Create Account" : "Log In";
      document.getElementById('authToggleText').innerText = isSignUpMode ? "Already have an account?" : "Need a garage account?";
      document.getElementById('authToggleBtn').innerText = isSignUpMode ? "Log In" : "Sign Up";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('authSubmitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";

      if (isSignUpMode) {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert('Account created! You are now logged in.');
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
      }

      submitBtn.disabled = false;
      closeModal('authModal');
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    // -------------------------------------------------------------
    // 3. STORAGE & DATABASE OPERATIONS
    // -------------------------------------------------------------
    async function fetchCars() {
      const { data, error } = await supabaseClient
        .from('cars')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error fetching cars:', error);
        return;
      }

      for (let car of (data || [])) {
        if (car.postcode) {
          const coords = await fetchPostcodeCoords(car.postcode);
          if (coords) {
            car.computed_distance = calculateDistanceMiles(userCoords.lat, userCoords.lng, coords.lat, coords.lng);
          } else {
            car.computed_distance = car.distance_miles || 5;
          }
        } else {
          car.computed_distance = 5;
        }
      }

      allCars = data || [];
      applyFilters();
    }

    async function uploadPhoto(file) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Math.random()}.${fileExt}`;
      const filePath = `car-photos/${fileName}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('car-photos')
        .upload(filePath, file);

      if (uploadError) {
        console.error('Photo upload error:', uploadError);
        return null;
      }

      const { data } = supabaseClient
        .storage
        .from('car-photos')
        .getPublicUrl(filePath);

      return data.publicUrl;
    }

    async function handleNewPost(e) {
      e.preventDefault();
      if (!currentUser) {
        alert('Please log in to post a vehicle listing.');
        openAuthModal();
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      let imageUrl = "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80";
      const imageFileInput = document.getElementById('newImageFile');
      
      if (imageFileInput.files.length > 0) {
        submitBtn.innerText = "Compressing & Uploading Photo...";
        const compressedFile = await compressImage(imageFileInput.files[0]);
        const uploadedUrl = await uploadPhoto(compressedFile);
        if (uploadedUrl) imageUrl = uploadedUrl;
      }

      submitBtn.innerText = "Publishing...";

      const postcode = document.getElementById('newPostcode').value.toUpperCase();
      const coords = await fetchPostcodeCoords(postcode);

      const newCar = {
        title: document.getElementById('newTitle').value,
        price: parseInt(document.getElementById('newPrice').value),
        fuel: document.getElementById('newFuel').value,
        mileage: document.getElementById('newMileage').value,
        postcode: postcode,
        distance_miles: coords ? calculateDistanceMiles(userCoords.lat, userCoords.lng, coords.lat, coords.lng) : 5,
        garage: "My Workshop Garage",
        fixes: document.getElementById('newNotes').value,
        image: imageUrl,
        user_id: currentUser.id
      };

      const { error } = await supabaseClient
        .from('cars')
        .insert([newCar]);

      submitBtn.innerText = "Publish Listing";
      submitBtn.disabled = false;

      if (error) {
        alert('Error saving to database: ' + error.message);
        return;
      }

      closeModal('postModal');
      await fetchCars();
      alert('Vehicle posted successfully!');
    }

    async function deleteCar(id, fromModal = false) {
      if (!confirm('Are you sure you want to permanently delete this listing?')) return;

      const { error } = await supabaseClient
        .from('cars')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Failed to delete listing: ' + error.message);
        return;
      }

      allCars = allCars.filter(c => c.id !== id);
      applyFilters();

      if (fromModal) closeModal('detailModal');
      alert('Listing deleted');
    }

    // -------------------------------------------------------------
    // UI RENDER & FILTER FUNCTIONS
    // -------------------------------------------------------------
    function renderCars(carsToRender) {
      const grid = document.getElementById('carGrid');
      grid.innerHTML = '';

      if (carsToRender.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-xl text-center border border-dashed border-gray-300">
            <i class="fas fa-car-side text-4xl text-gray-300 mb-2"></i>
            <h4 class="font-bold text-gray-700">No vehicles found</h4>
            <p class="text-xs text-gray-500 mt-1">Try expanding your distance radius or clearing your filters.</p>
          </div>
        `;
        return;
      }

      carsToRender.forEach(car => {
        const canManage = currentUser && (car.user_id === currentUser.id || !car.user_id);
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition flex flex-col";
        card.innerHTML = `
          <div class="relative h-48 overflow-hidden bg-gray-100">
            <img src="${car.image || 'https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=600&q=80'}" alt="${car.title}" class="w-full h-full object-cover">
            <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[11px] font-semibold px-2 py-0.5 rounded-full backdrop-blur-sm">
              <i class="fas fa-gas-pump text-green-400 mr-1"></i>${car.fuel}
            </span>
            <span class="absolute top-2 right-2 bg-green-600 text-white text-xs font-bold px-2 py-1 rounded-md shadow">
              £${Number(car.price).toLocaleString()}
            </span>
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 text-base leading-snug mb-1">${car.title}</h3>
              <div class="flex items-center space-x-3 text-xs text-gray-500 mb-3">
                <span><i class="fas fa-tachometer-alt mr-1 text-gray-400"></i>${car.mileage}</span>
                <span>•</span>
                <span><i class="fas fa-map-marker-alt mr-1 text-green-600"></i>${car.computed_distance !== undefined ? car.computed_distance : 5} miles away (${car.postcode})</span>
              </div>

              <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 mb-3 text-xs text-gray-700">
                <div class="font-semibold text-slate-900 mb-0.5 flex items-center">
                  <i class="fas fa-wrench text-xs text-green-600 mr-1.5"></i> Garage Fixes Executed:
                </div>
                <p class="line-clamp-2 text-gray-600 text-[11px]">${car.fixes}</p>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between text-xs border-t pt-2.5 text-gray-500">
                <span class="font-medium text-gray-800"><i class="fas fa-store mr-1 text-slate-400"></i>${car.garage || 'Verified Garage'}</span>
                <span class="text-amber-600 font-bold">5.0 ★</span>
              </div>
              
              <div class="mt-3 flex gap-2">
                <button onclick="openDetailModal(${car.id})" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg transition">
                  View Inspection & Contact
                </button>
                ${canManage ? `
                  <button onclick="deleteCar(${car.id})" class="w-28 px-3 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition">
                    <i class="fas fa-trash-alt mr-1"></i> Delete
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function applyFilters() {
      const radius = parseInt(document.getElementById('radiusSelect').value);
      const fuel = document.getElementById('fuelSelect').value;
      const keyword = document.getElementById('keywordInput').value.toLowerCase();
      const userPostcode = document.getElementById('postcodeInput').value.toUpperCase() || "CV1 2WT";

      const filtered = allCars.filter(car => {
        const dist = car.computed_distance !== undefined ? car.computed_distance : 5;
        const matchesRadius = dist <= radius;
        const matchesFuel = (fuel === 'ALL') || (car.fuel === fuel);
        const matchesKeyword = (car.title && car.title.toLowerCase().includes(keyword)) || (car.fixes && car.fixes.toLowerCase().includes(keyword));
        return matchesRadius && matchesFuel && matchesKeyword;
      });

      document.getElementById('resultsCount').innerText = `Showing ${filtered.length} garage-inspected cars within ${radius} miles of ${userPostcode}`;
      renderCars(filtered);
    }

    function resetFilters() {
      document.getElementById('radiusSelect').value = "20";
      document.getElementById('fuelSelect').value = "ALL";
      document.getElementById('keywordInput').value = "";
      document.getElementById('postcodeInput').value = "CV1 2WT";
      userCoords = { lat: 52.4068, lng: -1.5197 };
      applyFilters();
    }

    function openDetailModal(id) {
      const car = allCars.find(c => c.id === id);
      if (!car) return;

      const canManage = currentUser && (car.user_id === currentUser.id || !car.user_id);

      document.getElementById('modalTitle').innerText = car.title;
      document.getElementById('modalBody').innerHTML = `
        <img src="${car.image || 'https://images.unsplash.com/photo-1590362891991-f776e747a588?auto=format&fit=crop&w=600&q=80'}" class="w-full h-48 object-cover rounded-xl mb-3">
        <div class="flex justify-between items-center bg-green-50 p-3 rounded-lg border border-green-200">
          <div>
            <span class="text-xs text-green-800 uppercase font-bold tracking-wide">Direct Garage Price</span>
            <div class="text-2xl font-bold text-green-700">£${Number(car.price).toLocaleString()}</div>
          </div>
          <span class="text-xs bg-green-200 text-green-900 font-semibold px-2.5 py-1 rounded-full">3 Months Garage Warranty</span>
        </div>

        <div class="space-y-2 text-sm text-gray-700">
          <h4 class="font-bold text-gray-900 flex items-center"><i class="fas fa-clipboard-check text-green-600 mr-2"></i> Mechanic Inspection Report</h4>
          <p class="bg-gray-50 p-3 rounded-lg border text-xs text-gray-600 leading-relaxed">${car.fixes}</p>
        </div>

        <div class="border-t pt-3 flex items-center justify-between">
          <div>
            <div class="font-bold text-gray-900">${car.garage || 'Verified Garage'}</div>
            <div class="text-xs text-gray-500"><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i>${car.postcode} (${car.computed_distance !== undefined ? car.computed_distance : 5} miles away)</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="alert('Connecting to Garage Phone: 024 7600 1122')" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold text-xs rounded-lg shadow">
              <i class="fas fa-phone-alt mr-1"></i> Call Garage
            </button>
            ${canManage ? `
              <button onclick="deleteCar(${car.id}, true)" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg shadow">
                <i class="fas fa-trash-alt mr-1"></i> Delete Listing
              </button>
            ` : ''}
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function openPostModal() {
      if (!currentUser) {
        alert('Please log in or create a garage account to post listings.');
        openAuthModal();
        return;
      }
      document.getElementById('postModal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function toggleMobileView() {
      const container = document.getElementById('appContainer');
      const icon = document.getElementById('viewIcon');
      const text = document.getElementById('viewText');

      isMobileView = !isMobileView;
      if (isMobileView) {
        container.className = "mobile-wrapper my-6";
        container.children[0].classList.add('text-xs');
        icon.className = "fas fa-desktop text-green-400";
        text.innerText = "Switch to Desktop View";
      } else {
        container.className = "max-w-7xl mx-auto p-4 md:p-6 transition-all duration-300";
        icon.className = "fas fa-mobile-alt text-green-400";
        text.innerText = "Switch to Mobile Frame View";
      }
    }

    // INITIALIZATION
    document.addEventListener('DOMContentLoaded', () => {
      initAuth();
      fetchCars();
    });
  </script>
</body>
</html>
